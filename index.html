<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Three.js Budapest KRESZ Driving Simulation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #000;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px;
      font-family: sans-serif;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div id="info">
    <h2>Controls</h2>
    <p>Up: Accelerate Forward<br>
      Down: Brake/Reverse<br>
      Left/Right: Steer<br>
      Speed Limit: 0.15 (units/frame)<br>
      Red Light or Speeding → Infraction</p>
    <div id="infractions"></div>
  </div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.151.3/build/three.module.js';

    // ----- Basic Scene Setup -----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfd1e5); // light sky
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Resize handling
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ----- Lights -----
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // ----- Road System -----
    // Base ground
    const groundGeometry = new THREE.PlaneGeometry(100, 100);
    const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x7CFC00 }); // Grass color
    const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
    groundMesh.rotation.x = -Math.PI / 2; // make it horizontal
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    // Create roads
    function createRoad(width, length, posX, posZ, rotationY = 0) {
      const roadGeometry = new THREE.PlaneGeometry(width, length);
      const roadMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 }); // dark asphalt
      const road = new THREE.Mesh(roadGeometry, roadMaterial);
      road.rotation.x = -Math.PI / 2;
      road.rotation.z = rotationY;
      road.position.set(posX, 0.01, posZ); // Slightly above ground to prevent z-fighting
      road.receiveShadow = true;
      scene.add(road);
      return road;
    }

    // Road markings
    function createRoadMarking(width, length, posX, posZ, rotationY = 0) {
      const markingGeometry = new THREE.PlaneGeometry(width, length);
      const markingMaterial = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
      const marking = new THREE.Mesh(markingGeometry, markingMaterial);
      marking.rotation.x = -Math.PI / 2;
      marking.rotation.z = rotationY;
      marking.position.set(posX, 0.02, posZ); // Slightly above road
      scene.add(marking);
      return marking;
    }

    // Create a 4-way intersection
    // Main roads
    createRoad(8, 50, 0, -25, 0); // North-South road
    createRoad(8, 50, 0, 25, 0);  // South-North road
    createRoad(50, 8, 25, 0, 0);  // East-West road
    createRoad(50, 8, -25, 0, 0); // West-East road

    // Intersection square
    createRoad(10, 10, 0, 0, 0);  // Center intersection

    // Road markings - center lines
    for (let i = -24; i < 24; i += 4) {
      if (i > -6 && i < 6) continue; // Skip intersection area
      createRoadMarking(0.3, 2, 0, i, 0); // North-South
      createRoadMarking(2, 0.3, i, 0, 0); // East-West
    }

    // ----- Traffic Lights -----
    function createTrafficLight(posX, posZ, rotationY) {
      const group = new THREE.Group();

      // Pole
      const lightPoleGeom = new THREE.BoxGeometry(0.1, 3, 0.1);
      const lightPoleMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
      const trafficLightPole = new THREE.Mesh(lightPoleGeom, lightPoleMat);
      trafficLightPole.position.y = 1.5;
      trafficLightPole.castShadow = true;
      group.add(trafficLightPole);

      // Light box
      const lightBoxGeom = new THREE.BoxGeometry(0.3, 0.9, 0.3);
      const lightBoxMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
      const trafficLightBox = new THREE.Mesh(lightBoxGeom, lightBoxMat);
      trafficLightBox.position.y = 2.8;
      trafficLightBox.castShadow = true;
      group.add(trafficLightBox);

      // Lights
      const lightGeom = new THREE.CircleGeometry(0.1, 16);

      // Red light
      const redLightMat = new THREE.MeshPhongMaterial({ color: 0x660000, emissive: 0x330000 });
      const redLight = new THREE.Mesh(lightGeom, redLightMat);
      redLight.position.set(0, 3.0, 0.16);
      redLight.rotation.x = -Math.PI / 2;
      group.add(redLight);

      // Yellow light
      const yellowLightMat = new THREE.MeshPhongMaterial({ color: 0x666600, emissive: 0x333300 });
      const yellowLight = new THREE.Mesh(lightGeom, yellowLightMat);
      yellowLight.position.set(0, 2.8, 0.16);
      yellowLight.rotation.x = -Math.PI / 2;
      group.add(yellowLight);

      // Green light
      const greenLightMat = new THREE.MeshPhongMaterial({ color: 0x006600, emissive: 0x003300 });
      const greenLight = new THREE.Mesh(lightGeom, greenLightMat);
      greenLight.position.set(0, 2.6, 0.16);
      greenLight.rotation.x = -Math.PI / 2;
      group.add(greenLight);

      // Position and rotate the entire traffic light
      group.position.set(posX, 0, posZ);
      group.rotation.y = rotationY;
      scene.add(group);

      return {
        group: group,
        red: redLight,
        yellow: yellowLight,
        green: greenLight,
        state: "RED", // start with red
        getState: function () { return this.state; }
      };
    }

    // Create traffic lights at each approach to the intersection
    const trafficLights = [
      createTrafficLight(3, -5, 0),       // North approach (facing South)
      createTrafficLight(-3, 5, Math.PI),  // South approach (facing North)
      createTrafficLight(5, 3, Math.PI / 2), // East approach (facing West)
      createTrafficLight(-5, -3, -Math.PI / 2) // West approach (facing East)
    ];

    // Traffic light state management
    let trafficLightTimer = 0;
    const greenTime = 10;  // seconds
    const yellowTime = 3;
    const redTime = 13;    // red includes green+yellow time for perpendicular direction

    function updateTrafficLights(delta) {
      trafficLightTimer += delta;
      const cycle = greenTime + yellowTime + redTime;
      const mod = trafficLightTimer % cycle;

      // North-South traffic lights
      if (mod < greenTime) {
        setTrafficLightState(0, "GREEN");
        setTrafficLightState(1, "GREEN");
        setTrafficLightState(2, "RED");
        setTrafficLightState(3, "RED");
      } else if (mod < greenTime + yellowTime) {
        setTrafficLightState(0, "YELLOW");
        setTrafficLightState(1, "YELLOW");
        setTrafficLightState(2, "RED");
        setTrafficLightState(3, "RED");
      } else {
        setTrafficLightState(0, "RED");
        setTrafficLightState(1, "RED");

        // East-West traffic lights
        const eastWestMod = mod - (greenTime + yellowTime);
        if (eastWestMod < greenTime) {
          setTrafficLightState(2, "GREEN");
          setTrafficLightState(3, "GREEN");
        } else if (eastWestMod < greenTime + yellowTime) {
          setTrafficLightState(2, "YELLOW");
          setTrafficLightState(3, "YELLOW");
        } else {
          setTrafficLightState(2, "RED");
          setTrafficLightState(3, "RED");
        }
      }
    }

    function setTrafficLightState(index, state) {
      const light = trafficLights[index];
      light.state = state;

      // Reset all lights
      light.red.material.emissive.set(0x330000);
      light.yellow.material.emissive.set(0x333300);
      light.green.material.emissive.set(0x003300);

      // Set the active light
      if (state === "RED") {
        light.red.material.emissive.set(0xff0000);
      } else if (state === "YELLOW") {
        light.yellow.material.emissive.set(0xffff00);
      } else if (state === "GREEN") {
        light.green.material.emissive.set(0x00ff00);
      }
    }

    // ----- Player Car -----
    function createCar(color, isPlayer = false) {
      const carGroup = new THREE.Group();

      // Car body
      const bodyGeometry = new THREE.BoxGeometry(1, 0.5, 2);
      const bodyMaterial = new THREE.MeshPhongMaterial({ color: color });
      const carBody = new THREE.Mesh(bodyGeometry, bodyMaterial);
      carBody.position.y = 0.5;
      carBody.castShadow = true;
      carGroup.add(carBody);

      // Car roof
      const roofGeometry = new THREE.BoxGeometry(0.8, 0.3, 1);
      const roofMaterial = new THREE.MeshPhongMaterial({ color: color });
      const carRoof = new THREE.Mesh(roofGeometry, roofMaterial);
      carRoof.position.y = 0.9;
      carRoof.castShadow = true;
      carGroup.add(carRoof);

      // Wheels with proper steering for front wheels
      const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
      const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x111111 });

      // Create steering pivots for front wheels
      const frontLeftPivot = new THREE.Group();
      frontLeftPivot.position.set(-0.5, 0.3, 0.7);  // Front left position
      carGroup.add(frontLeftPivot);

      const frontRightPivot = new THREE.Group();
      frontRightPivot.position.set(0.5, 0.3, 0.7);  // Front right position
      carGroup.add(frontRightPivot);

      // Front wheels (will be steerable)
      const frontLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      frontLeftWheel.rotation.z = Math.PI / 2;
      frontLeftWheel.castShadow = true;
      frontLeftPivot.add(frontLeftWheel);

      const frontRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      frontRightWheel.rotation.z = Math.PI / 2;
      frontRightWheel.castShadow = true;
      frontRightPivot.add(frontRightWheel);

      // Rear wheels (fixed)
      const rearLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      rearLeftWheel.position.set(-0.5, 0.3, -0.7);
      rearLeftWheel.rotation.z = Math.PI / 2;
      rearLeftWheel.castShadow = true;
      carGroup.add(rearLeftWheel);

      const rearRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      rearRightWheel.position.set(0.5, 0.3, -0.7);
      rearRightWheel.rotation.z = Math.PI / 2;
      rearRightWheel.castShadow = true;
      carGroup.add(rearRightWheel);

      // Store wheel pivots for steering
      carGroup.frontLeftPivot = frontLeftPivot;
      carGroup.frontRightPivot = frontRightPivot;

      // Headlights
      if (isPlayer) {
        const headlightGeometry = new THREE.CircleGeometry(0.1, 16);
        const headlightMaterial = new THREE.MeshPhongMaterial({
          color: 0xffffcc,
          emissive: 0xffffaa
        });

        const leftHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
        leftHeadlight.position.set(-0.4, 0.5, 1.01);
        leftHeadlight.rotation.y = Math.PI;
        carGroup.add(leftHeadlight);

        const rightHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
        rightHeadlight.position.set(0.4, 0.5, 1.01);
        rightHeadlight.rotation.y = Math.PI;
        carGroup.add(rightHeadlight);
      }

      // Add collision box (invisible for detection)
      carGroup.collisionBox = new THREE.Box3();

      scene.add(carGroup);
      return carGroup;
    }

    // Player Car
    const playerCar = createCar(0x0000ff, true);
    playerCar.position.set(0, 0, 10); // Starting position

    // Car physics parameters
    let carState = {
      position: new THREE.Vector2(0, 10), // x, z position
      heading: 0,                        // car's heading in radians
      velocity: 0,                       // current velocity (positive = forward, negative = reverse)
      wheelAngle: 0,                     // steering wheel angle in radians
      steeringAngle: 0                   // actual front wheel steering angle
    };

    // Velocity components for collision detection
    let carVelocityX = 0;
    let carVelocityZ = 0;

    // Car specs
    const CAR_SPECS = {
      maxSteeringAngle: THREE.MathUtils.degToRad(30),  // Reduced max steering angle (more realistic)
      wheelBase: 1.4,                                  // distance between front and rear axles
      trackWidth: 1.0,                                 // distance between left and right wheels
      acceleration: 0.0006,                            // acceleration rate
      braking: 0.0012,                                // braking rate
      maxSpeed: 0.13,                                 // maximum speed
      maxReverseSpeed: 0.05,                          // maximum reverse speed
      steeringSpeed: 0.05,                            // how quickly steering changes (reduced for more realistic feel)
      steeringReturnSpeed: 0.07,                      // how quickly steering returns to center
      friction: 0.0005,                               // rolling resistance/friction
      grip: 0.97,                                     // higher value = less drift (0-1)
      minTurningRadius: 3.0                           // minimum turning radius at full lock (in units)
    };

    // ----- AI Cars -----
    const aiCars = [];
    const carColors = [0xff0000, 0x00ff00, 0xffff00, 0xff00ff, 0xffa500];
    const carPaths = [
      { startPos: { x: -15, y: 0, z: 3 }, direction: "east", angle: -Math.PI / 2 },
      { startPos: { x: 3, y: 0, z: 15 }, direction: "north", angle: Math.PI },
      { startPos: { x: 15, y: 0, z: -3 }, direction: "west", angle: Math.PI / 2 },
      { startPos: { x: -3, y: 0, z: -15 }, direction: "south", angle: 0 },
    ];

    // Create AI cars
    for (let i = 0; i < 4; i++) {
      const path = carPaths[i];
      const car = createCar(carColors[i % carColors.length]);
      car.position.copy(path.startPos);
      car.rotation.y = path.angle;

      aiCars.push({
        mesh: car,
        speed: 0.05 + Math.random() * 0.05, // Random speed
        direction: path.direction,
        waiting: false,
        turnDirection: Math.random() < 0.3 ? "left" :
          (Math.random() < 0.5 ? "right" : "straight")
      });
    }

    function updateAICars(delta) {
      aiCars.forEach(car => {
        const mesh = car.mesh;
        let shouldMove = true;

        // Update car's collision box
        mesh.collisionBox.setFromObject(mesh);

        // Check for traffic light at intersection
        if (car.direction === "north" && mesh.position.z > -8 && mesh.position.z < -2) {
          if (trafficLights[0].state !== "GREEN") {
            shouldMove = false;
            car.waiting = true;
          }
        } else if (car.direction === "south" && mesh.position.z < 8 && mesh.position.z > 2) {
          if (trafficLights[1].state !== "GREEN") {
            shouldMove = false;
            car.waiting = true;
          }
        } else if (car.direction === "east" && mesh.position.x < 8 && mesh.position.x > 2) {
          if (trafficLights[2].state !== "GREEN") {
            shouldMove = false;
            car.waiting = true;
          }
        } else if (car.direction === "west" && mesh.position.x > -8 && mesh.position.x < -2) {
          if (trafficLights[3].state !== "GREEN") {
            shouldMove = false;
            car.waiting = true;
          }
        } else {
          car.waiting = false;
        }

        // Check for collision with player
        const playerBox = new THREE.Box3().setFromObject(playerCar);
        if (mesh.collisionBox.intersectsBox(playerBox)) {
          shouldMove = false;
          infractions.add("collision");
        }

        // Check for collision with other AI cars
        for (const otherCar of aiCars) {
          if (otherCar.mesh !== mesh) {
            const otherBox = new THREE.Box3().setFromObject(otherCar.mesh);
            if (mesh.collisionBox.intersectsBox(otherBox)) {
              if (!car.waiting) { // Only stop if not already waiting at light
                shouldMove = false;
              }
            }
          }
        }

        // Move car if allowed
        if (shouldMove) {
          // Movement based on direction
          if (car.direction === "north") {
            mesh.position.z -= car.speed;

            // Handle reaching intersection center
            if (mesh.position.z < 0 && mesh.position.z > -car.speed) {
              handleAITurn(car);
            }

            // Respawn if goes off map
            if (mesh.position.z < -50) {
              mesh.position.z = 50;
            }
          } else if (car.direction === "south") {
            mesh.position.z += car.speed;

            // Handle reaching intersection center
            if (mesh.position.z > 0 && mesh.position.z < car.speed) {
              handleAITurn(car);
            }

            // Respawn if goes off map
            if (mesh.position.z > 50) {
              mesh.position.z = -50;
            }
          } else if (car.direction === "east") {
            mesh.position.x += car.speed;

            // Handle reaching intersection center
            if (mesh.position.x > 0 && mesh.position.x < car.speed) {
              handleAITurn(car);
            }

            // Respawn if goes off map
            if (mesh.position.x > 50) {
              mesh.position.x = -50;
            }
          } else if (car.direction === "west") {
            mesh.position.x -= car.speed;

            // Handle reaching intersection center
            if (mesh.position.x < 0 && mesh.position.x > -car.speed) {
              handleAITurn(car);
            }

            // Respawn if goes off map
            if (mesh.position.x < -50) {
              mesh.position.x = 50;
            }
          }
        }
      });
    }

    function handleAITurn(car) {
      // If we're turning, change direction and rotate car
      if (car.turnDirection === "left") {
        if (car.direction === "north") {
          car.direction = "west";
          car.mesh.rotation.y = Math.PI / 2;
        } else if (car.direction === "south") {
          car.direction = "east";
          car.mesh.rotation.y = -Math.PI / 2;
        } else if (car.direction === "east") {
          car.direction = "north";
          car.mesh.rotation.y = Math.PI;
        } else if (car.direction === "west") {
          car.direction = "south";
          car.mesh.rotation.y = 0;
        }
      } else if (car.turnDirection === "right") {
        if (car.direction === "north") {
          car.direction = "east";
          car.mesh.rotation.y = -Math.PI / 2;
        } else if (car.direction === "south") {
          car.direction = "west";
          car.mesh.rotation.y = Math.PI / 2;
        } else if (car.direction === "east") {
          car.direction = "south";
          car.mesh.rotation.y = 0;
        } else if (car.direction === "west") {
          car.direction = "north";
          car.mesh.rotation.y = Math.PI;
        }
      }

      // Randomize turn direction for next intersection
      car.turnDirection = Math.random() < 0.3 ? "left" :
        (Math.random() < 0.5 ? "right" : "straight");
    }

    // ----- Infractions -----
    const infractions = new Set();

    // ----- Keyboard Input -----
    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };
    window.addEventListener("keydown", (e) => {
      if (keys.hasOwnProperty(e.code)) {
        keys[e.code] = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (keys.hasOwnProperty(e.code)) {
        keys[e.code] = false;
      }
    });

    // ----- Update Loop -----
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      let delta = clock.getDelta();  // seconds since last frame

      // 1. Update Traffic Lights
      updateTrafficLights(delta);

      // 2. Update Car Movement with improved physics
      updatePlayerCar(delta);

      // 3. Check for Red Light Violation
      checkTrafficLightViolations();

      // 4. Update AI Cars
      updateAICars(delta);

      // 5. Update Camera (chase cam)
      updateCamera();

      // 6. Render
      renderer.render(scene, camera);

      // Update infractions on screen
      updateInfractionDisplay();
    }

    function updatePlayerCar(delta) {
      // Scale delta time to ensure consistent speeds regardless of frame rate
      const timeScale = delta * 60; // normalized for 60fps

      // 1. Handle steering input
      if (keys.ArrowLeft) {
        carState.wheelAngle += CAR_SPECS.steeringSpeed * timeScale;
        carState.wheelAngle = Math.min(carState.wheelAngle, CAR_SPECS.maxSteeringAngle);
      } else if (keys.ArrowRight) {
        carState.wheelAngle -= CAR_SPECS.steeringSpeed * timeScale;
        carState.wheelAngle = Math.max(carState.wheelAngle, -CAR_SPECS.maxSteeringAngle);
      } else {
        // Return to center when not steering
        if (carState.wheelAngle > 0) {
          carState.wheelAngle -= CAR_SPECS.steeringReturnSpeed * timeScale;
          carState.wheelAngle = Math.max(0, carState.wheelAngle);
        } else if (carState.wheelAngle < 0) {
          carState.wheelAngle += CAR_SPECS.steeringReturnSpeed * timeScale;
          carState.wheelAngle = Math.min(0, carState.wheelAngle);
        }
      }

      // Only adjust wheel visuals - keep this simple
      playerCar.frontLeftPivot.rotation.y = carState.wheelAngle;
      playerCar.frontRightPivot.rotation.y = carState.wheelAngle;

      // 2. Handle acceleration/braking
      const forward = keys.ArrowUp;
      const backward = keys.ArrowDown;

      if (forward && !backward) {
        if (carState.velocity < 0) {
          // Braking from reverse
          carState.velocity += CAR_SPECS.braking * timeScale;
        } else {
          // Accelerate forward
          carState.velocity += CAR_SPECS.acceleration * timeScale * (1 - Math.abs(carState.velocity) / CAR_SPECS.maxSpeed);
        }
      } else if (backward && !forward) {
        if (carState.velocity > 0) {
          // Braking from forward; if nearly stopped, force reverse
          carState.velocity -= CAR_SPECS.braking * timeScale;
          if (carState.velocity < 0.001) {
            carState.velocity = -0.001; // force a small reverse value
          }
        } else {
          // Accelerate backward
          carState.velocity -= CAR_SPECS.acceleration * timeScale * (1 - Math.abs(carState.velocity) / CAR_SPECS.maxReverseSpeed);
        }
      } else {
        // No input: apply friction
        if (Math.abs(carState.velocity) < CAR_SPECS.friction * timeScale) {
          carState.velocity = 0;
        } else {
          carState.velocity -= Math.sign(carState.velocity) * CAR_SPECS.friction * timeScale;
        }
      }

      // Limit speeds
      if (carState.velocity > CAR_SPECS.maxSpeed) {
        carState.velocity = CAR_SPECS.maxSpeed;
        infractions.add("speeding");
      } else if (carState.velocity < -CAR_SPECS.maxReverseSpeed) {
        carState.velocity = -CAR_SPECS.maxReverseSpeed;
      }

      // 3. Simplified bicycle model with front-wheel steering
      if (Math.abs(carState.velocity) > 0.001) {
        const speed = Math.abs(carState.velocity);
        const direction = Math.sign(carState.velocity); // +1 for forward, -1 for reverse

        // For the bicycle model, if we're in reverse, flip the steering effect
        // This is because cars steer differently in reverse (opposite direction)
        const steeringMultiplier = direction;
        const effectiveWheelAngle = carState.wheelAngle * steeringMultiplier;

        // Compute the front axle position
        const frontX = carState.position.x + Math.sin(carState.heading) * CAR_SPECS.wheelBase;
        const frontY = carState.position.y + Math.cos(carState.heading) * CAR_SPECS.wheelBase;

        // Move the front axle in the direction of the front wheel
        const newFrontX = frontX + Math.sin(carState.heading + effectiveWheelAngle) * speed;
        const newFrontY = frontY + Math.cos(carState.heading + effectiveWheelAngle) * speed;

        // The new heading is determined by the vector from the rear to the new front position
        const newHeading = Math.atan2(newFrontX - carState.position.x, newFrontY - carState.position.y);

        if (direction > 0) {
          // Forward: Move the rear position based on the new heading
          const newRearX = carState.position.x + Math.sin(carState.heading) * speed;
          const newRearY = carState.position.y + Math.cos(carState.heading) * speed;

          // Track velocities
          carVelocityX = newRearX - carState.position.x;
          carVelocityZ = newRearY - carState.position.y;

          // Update car state
          carState.position.x = newRearX;
          carState.position.y = newRearY;
          carState.heading = newHeading;
        } else {
          // Reverse: completely new approach for reverse turning
          // When going backward, we need to move backward in an arc without any forward component

          // Calculate how much we'll turn based on the steering angle
          const turningRadius = Math.abs(effectiveWheelAngle) < 0.01
            ? Infinity
            : CAR_SPECS.wheelBase / Math.tan(Math.abs(effectiveWheelAngle));

          // Calculate our angular change
          let angularChange = 0;
          if (turningRadius !== Infinity) {
            angularChange = speed / turningRadius * Math.sign(effectiveWheelAngle);
          }

          // Going straight backward
          if (turningRadius === Infinity || Math.abs(angularChange) < 0.0001) {
            // Simple backward movement
            const newRearX = carState.position.x - Math.sin(carState.heading) * speed;
            const newRearY = carState.position.y - Math.cos(carState.heading) * speed;

            carVelocityX = newRearX - carState.position.x;
            carVelocityZ = newRearY - carState.position.y;

            carState.position.x = newRearX;
            carState.position.y = newRearY;
          }
          // Turning while reversing
          else {
            // Update the heading first (opposite direction compared to forward)
            const newHeading = carState.heading - angularChange;

            // Then simply move backward along this new heading
            const newRearX = carState.position.x - Math.sin(newHeading) * speed;
            const newRearY = carState.position.y - Math.cos(newHeading) * speed;

            carVelocityX = newRearX - carState.position.x;
            carVelocityZ = newRearY - carState.position.y;

            carState.position.x = newRearX;
            carState.position.y = newRearY;
            carState.heading = newHeading;
          }
        }
      }

      // 4. Apply the position and heading to the car model
      playerCar.position.x = carState.position.x;
      playerCar.position.z = carState.position.y;
      playerCar.rotation.y = carState.heading;
    }

    function checkTrafficLightViolations() {
      // Get current direction of travel from velocity
      const movingNorth = carVelocityZ < -0.01;
      const movingSouth = carVelocityZ > 0.01;
      const movingEast = carVelocityX > 0.01;
      const movingWest = carVelocityX < -0.01;

      // North intersection check
      if (playerCar.position.z < -2 && playerCar.position.z > -8 &&
        playerCar.position.x > -4 && playerCar.position.x < 4) {
        // Check north-facing light if car is moving north
        if (movingNorth) {
          if (trafficLights[0].state !== "GREEN") {
            infractions.add("ran_red_light");
          }
        }
      }

      // South intersection check
      if (playerCar.position.z > 2 && playerCar.position.z < 8 &&
        playerCar.position.x > -4 && playerCar.position.x < 4) {
        // Check south-facing light if car is moving south
        if (movingSouth) {
          if (trafficLights[1].state !== "GREEN") {
            infractions.add("ran_red_light");
          }
        }
      }

      // East intersection check
      if (playerCar.position.x > 2 && playerCar.position.x < 8 &&
        playerCar.position.z > -4 && playerCar.position.z < 4) {
        // Check east-facing light if car is moving east
        if (movingEast) {
          if (trafficLights[2].state !== "GREEN") {
            infractions.add("ran_red_light");
          }
        }
      }

      // West intersection check
      if (playerCar.position.x < -2 && playerCar.position.x > -8 &&
        playerCar.position.z > -4 && playerCar.position.z < 4) {
        // Check west-facing light if car is moving west
        if (movingWest) {
          if (trafficLights[3].state !== "GREEN") {
            infractions.add("ran_red_light");
          }
        }
      }
    }

    function updateCamera() {
      const distance = 7;
      const height = 3.5;

      // If reversing, flip the heading by π (180°)
      const effectiveHeading = carState.velocity < 0 ? carState.heading + Math.PI : carState.heading;
      const camX = playerCar.position.x - Math.sin(effectiveHeading) * distance;
      const camZ = playerCar.position.z - Math.cos(effectiveHeading) * distance;

      const lerpFactor = 0.1;
      camera.position.x += (camX - camera.position.x) * lerpFactor;
      camera.position.z += (camZ - camera.position.z) * lerpFactor;
      camera.position.y = height;

      // Look at a point ahead of the car using effective heading
      const lookTarget = new THREE.Vector3(
        playerCar.position.x + Math.sin(effectiveHeading) * 2,
        playerCar.position.y + 0.5,
        playerCar.position.z + Math.cos(effectiveHeading) * 2
      );
      camera.lookAt(lookTarget);
    }

    function updateInfractionDisplay() {
      const container = document.getElementById("infractions");
      container.innerHTML = "";

      if (infractions.size === 0) {
        return;
      }

      container.innerHTML = "<h3>Infractions:</h3>";

      infractions.forEach((infraction) => {
        let p = document.createElement("p");
        if (infraction === "speeding") {
          p.innerText = "Speeding";
          p.style.color = "red";
        } else if (infraction === "ran_red_light") {
          p.innerText = "Red Light Violation";
          p.style.color = "red";
        } else if (infraction === "collision") {
          p.innerText = "Collision with another vehicle";
          p.style.color = "red";
        }
        container.appendChild(p);
      });
    }

    animate();
  </script>
</body>
