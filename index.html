<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Three.js Budapest KRESZ Driving Simulation v2</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #333;
      /* Darker background for info panel */
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      /* White text for contrast */
      background: rgba(0, 0, 0, 0.7);
      /* Darker background */
      padding: 15px;
      border-radius: 5px;
      font-family: sans-serif;
      z-index: 9999;
      max-width: 300px;
      /* Limit width */
    }

    #info h2 {
      margin-top: 0;
    }

    #infractions p {
      margin: 5px 0;
      color: #ff4d4d;
      /* Red color for infractions */
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="info">
    <h2>KRESZ Practice Controls</h2>
    <p>
      Up: Accelerate<br>
      Down: Brake/Reverse<br>
      Left/Right: Steer<br>
      <strong id="speed-limit-info">Speed Limit: 50 km/h (Sim: 0.13 u/f)</strong><br>
      <em>Note: No stop lines. Check lights before entering intersection.</em>
    </p>
    <div id="infractions"></div>
  </div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.151.3/build/three.module.js';

    // === Constants ===
    const CHUNK_SIZE = 50;
    const ROAD_WIDTH = 8;
    const HALF_ROAD_WIDTH = ROAD_WIDTH / 2;
    const LANE_WIDTH = ROAD_WIDTH / 2; // Each direction gets half the road
    const LANE_CENTER_OFFSET = LANE_WIDTH / 2; // Offset from road center to lane center
    const SPEED_LIMIT = 0.13; // Corresponds roughly to 50km/h in sim units

    // === Basic Scene Setup ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfd1e5); // light sky
    scene.fog = new THREE.Fog(0xbfd1e5, 50, 150); // Add some fog for depth

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadows
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // === Lights ===
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(60, 80, 40);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    const shadowSize = 70;
    dirLight.shadow.camera.left = -shadowSize;
    dirLight.shadow.camera.right = shadowSize;
    dirLight.shadow.camera.top = shadowSize;
    dirLight.shadow.camera.bottom = -shadowSize;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 200;
    scene.add(dirLight);
    scene.add(dirLight.target);

    // === Global Parameters & Storage ===
    const activeChunks = {};
    const chunkRadius = 2;

    function getChunkKey(i, j) {
      return `${i},${j}`;
    }

    // === Procedural Chunk Generation ===
    function generateChunk(i, j) {
      const group = new THREE.Group();
      group.userData.chunkCoords = { i, j };
      group.userData.isIntersectionChunk = true; // Assume all chunks are intersections

      // --- Base Grass ---
      const grassGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE);
      const grassMat = new THREE.MeshPhongMaterial({ color: 0x7CFC00 });
      const grassMesh = new THREE.Mesh(grassGeo, grassMat);
      grassMesh.rotation.x = -Math.PI / 2;
      grassMesh.receiveShadow = true;
      group.add(grassMesh);

      // --- Roads ---
      const roadMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
      // Vertical road segment
      const vertRoadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, CHUNK_SIZE);
      const vertRoad = new THREE.Mesh(vertRoadGeo, roadMat);
      vertRoad.rotation.x = -Math.PI / 2;
      vertRoad.position.set(0, 0.01, CHUNK_SIZE / 2); // Centered Z
      vertRoad.receiveShadow = true;
      group.add(vertRoad);
      // Horizontal road segment
      const horizRoadGeo = new THREE.PlaneGeometry(CHUNK_SIZE, ROAD_WIDTH);
      const horizRoad = new THREE.Mesh(horizRoadGeo, roadMat);
      horizRoad.rotation.x = -Math.PI / 2;
      horizRoad.position.set(CHUNK_SIZE / 2, 0.01, 0); // Centered X
      horizRoad.receiveShadow = true;
      group.add(horizRoad);

      // --- Markings (Modified for continuous double dashed lines) ---
      const markingMat = new THREE.MeshPhongMaterial({ color: 0xFFFFFF });
      const dashLength = 2;
      const dashGap = 3;
      const totalDashSegment = dashLength + dashGap;

      // Vertical dashed lines (Single centered line)
      const numVertDashes = Math.floor(CHUNK_SIZE / totalDashSegment);
      for (let d = 0; d < numVertDashes; d++) {
        const zPos = d * totalDashSegment + dashGap / 2 - CHUNK_SIZE / 2; // Center dashes
        createDashMarking(group, 0, zPos, 0.2, dashLength, markingMat); // Position at x = 0
      }

      // Horizontal dashed lines (Single centered line)
      const numHorizDashes = Math.floor(CHUNK_SIZE / totalDashSegment);
      for (let d = 0; d < numHorizDashes; d++) {
        const xPos = d * totalDashSegment + dashGap / 2 - CHUNK_SIZE / 2; // Center dashes
        createDashMarking(group, xPos, 0, dashLength, 0.2, markingMat); // Position at z = 0
      }

      // Place Traffic Lights
      placeTrafficLightsRightSide(group);

      // --- Scenery (Buildings, Trees, Fences) ---
      const buildingOffset = HALF_ROAD_WIDTH + 10;
      const buildingPositions = [
        { x: -buildingOffset, z: -buildingOffset }, { x: buildingOffset, z: -buildingOffset },
        { x: -buildingOffset, z: buildingOffset }, { x: buildingOffset, z: buildingOffset }
      ];
      buildingPositions.forEach(pos => {
        if (Math.random() > 0.5) {
          const width = 8 + Math.random() * 8;
          const depth = 8 + Math.random() * 8;
          const height = 10 + Math.random() * 15;
          const building = createBuilding(pos.x, pos.z, width, depth, height);
          group.add(building);
          if (Math.random() > 0.6) {
            const fence = createFence(pos.x, pos.z, width + 4, depth + 4);
            group.add(fence);
          }
        }
      });
      for (let k = 0; k < 5; k++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = HALF_ROAD_WIDTH + 5 + Math.random() * (CHUNK_SIZE / 2 - HALF_ROAD_WIDTH - 5);
        const treeX = Math.cos(angle) * radius;
        const treeZ = Math.sin(angle) * radius;
        if (Math.abs(treeX) > HALF_ROAD_WIDTH + 2 && Math.abs(treeZ) > HALF_ROAD_WIDTH + 2) { // Avoid placing on roads/corners
          const tree = createTree(treeX, treeZ);
          group.add(tree);
        }
      }

      // --- AI Cars ---
      group.userData.aiCars = [];
      const numAICars = Math.floor(Math.random() * 3);
      for (let a = 0; a < numAICars; a++) {
        const aiCar = createCar(0xff0000 + Math.floor(Math.random() * 0xeeeeee));
        const startBuffer = 10; // Start cars further away from center
        if (Math.random() < 0.5) { // vertical
          const startZ = (Math.random() > 0.5 ? 1 : -1) * (CHUNK_SIZE / 2 - startBuffer * Math.random());
          const direction = startZ > 0 ? "south" : "north"; // If starting North, heading South etc.
          aiCar.position.set(direction === "south" ? LANE_CENTER_OFFSET : -LANE_CENTER_OFFSET, 0, startZ); // Place in correct lane
          aiCar.rotation.y = (direction === "south") ? Math.PI : 0;
          group.userData.aiCars.push({ mesh: aiCar, direction: direction });
        } else { // horizontal
          const startX = (Math.random() > 0.5 ? 1 : -1) * (CHUNK_SIZE / 2 - startBuffer * Math.random());
          const direction = startX > 0 ? "west" : "east";
          aiCar.position.set(startX, 0, direction === "west" ? -LANE_CENTER_OFFSET : LANE_CENTER_OFFSET); // Place in correct lane
          aiCar.rotation.y = (direction === "west") ? -Math.PI / 2 : Math.PI / 2;
          group.userData.aiCars.push({ mesh: aiCar, direction: direction });
        }
        group.add(aiCar);
      }

      // Position the chunk group correctly in world space
      group.position.set(i * CHUNK_SIZE + CHUNK_SIZE / 2, 0, j * CHUNK_SIZE + CHUNK_SIZE / 2);
      scene.add(group);
      return group;
    }

    // Helper for dashed lines (simplified)
    function createDashMarking(group, x, z, w, h, material) {
      const dashMarkingGeo = new THREE.PlaneGeometry(w, h);
      const dashMarking = new THREE.Mesh(dashMarkingGeo, material);
      dashMarking.rotation.x = -Math.PI / 2;
      // Adjust position calculation for centered dashes
      dashMarking.position.set(x, 0.02, z); // Simplified positioning
      group.add(dashMarking);
    }

    // === Update the World ===
    function updateWorld() {
      const pX = playerCar.position.x;
      const pZ = playerCar.position.z;
      const curI = Math.floor(pX / CHUNK_SIZE);
      const curJ = Math.floor(pZ / CHUNK_SIZE);

      // Activate nearby chunks
      for (let i = curI - chunkRadius; i <= curI + chunkRadius; i++) {
        for (let j = curJ - chunkRadius; j <= curJ + chunkRadius; j++) {
          const key = getChunkKey(i, j);
          if (!activeChunks[key]) {
            // console.log(`Generating chunk ${key}`);
            activeChunks[key] = generateChunk(i, j);
          }
        }
      }

      // Deactivate far chunks
      for (const key in activeChunks) {
        const chunk = activeChunks[key];
        const { i, j } = chunk.userData.chunkCoords;
        if (Math.abs(i - curI) > chunkRadius + 1 || Math.abs(j - curJ) > chunkRadius + 1) {
          // console.log(`Removing chunk ${key}`);
          chunk.traverse(object => { // Dispose resources
            if (!object.isMesh) return;
            if (object.geometry) object.geometry.dispose();
            if (Array.isArray(object.material)) {
              object.material.forEach(mat => mat.dispose());
            } else if (object.material) {
              object.material.dispose();
            }
          });
          scene.remove(chunk);
          delete activeChunks[key];
        }
      }

      // Update light target
      dirLight.target.position.copy(playerCar.position);
      dirLight.target.updateMatrixWorld();
    }

    // === Update AI Cars (Adjusted for no stop lines) ===
    function updateAICars(delta) {
      const aiSpeed = 0.04 * delta * 60;
      const safeFollowingDistance = 5; // Increased slightly
      const intersectionStopBuffer = 2.0; // How far before the center (0,0) AI should stop for red light

      for (const key in activeChunks) {
        const chunk = activeChunks[key];
        if (!chunk.userData.aiCars || chunk.userData.aiCars.length === 0) continue;

        const aiCars = chunk.userData.aiCars;
        const trafficLights = chunk.userData.trafficLights;

        for (let i = aiCars.length - 1; i >= 0; i--) {
          const carData = aiCars[i];
          const carMesh = carData.mesh;
          let shouldMove = true;
          let approachingIntersectionCenter = false;

          if (!carMesh.collisionBox) carMesh.collisionBox = new THREE.Box3();
          carMesh.collisionBox.setFromObject(carMesh); // Update box

          const carPosLocal = carMesh.position.clone(); // Position relative to chunk center (0,0)

          // --- Traffic Light Check (Stop before center) ---
          if (trafficLights) {
            const distToCenter = carPosLocal.length(); // Distance from (0,0)

            // Check if approaching the intersection center area
            if (distToCenter < HALF_ROAD_WIDTH + intersectionStopBuffer + 5) { // Check within a radius
              if ((carData.direction === "north" && carPosLocal.z > -intersectionStopBuffer) || // Moving N, check if past south buffer
                (carData.direction === "south" && carPosLocal.z < intersectionStopBuffer) || // Moving S, check if past north buffer
                (carData.direction === "east" && carPosLocal.x > -intersectionStopBuffer) || // Moving E, check if past west buffer
                (carData.direction === "west" && carPosLocal.x < intersectionStopBuffer)) { // Moving W, check if past east buffer

                approachingIntersectionCenter = true;

                // Determine if the light for this car's flow is red/yellow
                let isLightRedOrYellow = false;
                if (carData.direction === "north" || carData.direction === "south") {
                  isLightRedOrYellow = trafficLights.state !== "NS_GREEN";
                } else { // East or West
                  isLightRedOrYellow = trafficLights.state !== "EW_GREEN";
                }

                // Stop if light is red/yellow AND car is before the designated buffer zone around the center
                if (isLightRedOrYellow) {
                  if ((carData.direction === "north" && carPosLocal.z > -intersectionStopBuffer) ||
                    (carData.direction === "south" && carPosLocal.z < intersectionStopBuffer) ||
                    (carData.direction === "east" && carPosLocal.x > -intersectionStopBuffer) ||
                    (carData.direction === "west" && carPosLocal.x < intersectionStopBuffer)) {
                    // Additional check to prevent stopping *inside* the intersection if light turns red late
                    if (distToCenter > intersectionStopBuffer * 0.5) {
                      shouldMove = false;
                    }
                  }
                }
              }
            }
          }


          // --- Collision Checks ---
          if (shouldMove) {
            // Vs Player
            const playerBox = new THREE.Box3().setFromObject(playerCar);
            if (carMesh.collisionBox.intersectsBox(playerBox)) {
              shouldMove = false;
              if (!infractions.has("collision")) infractions.add("collision"); // Add if not already present
            }

            // Vs Other AI
            const lookAheadDist = aiSpeed * 100 + safeFollowingDistance;
            const carWorldPos = carMesh.getWorldPosition(new THREE.Vector3());
            const carWorldDir = carMesh.getWorldDirection(new THREE.Vector3());
            const ray = new THREE.Ray(carWorldPos, carWorldDir);

            for (let j = 0; j < aiCars.length; j++) {
              if (i === j) continue;
              const otherCar = aiCars[j].mesh;
              if (!otherCar.collisionBox) otherCar.collisionBox = new THREE.Box3();
              otherCar.collisionBox.setFromObject(otherCar);

              const intersectionPoint = ray.intersectBox(otherCar.collisionBox, new THREE.Vector3());
              if (intersectionPoint && intersectionPoint.distanceTo(carWorldPos) < lookAheadDist) {
                shouldMove = false;
                break;
              }
              // Immediate proximity check (backup)
              if (carMesh.collisionBox.intersectsBox(otherCar.collisionBox)) {
                shouldMove = false;
                break;
              }
            }
          }


          // --- Movement & Chunk Transfer ---
          if (shouldMove) {
            if (carData.direction === "north") carMesh.position.z += aiSpeed;
            else if (carData.direction === "south") carMesh.position.z -= aiSpeed;
            else if (carData.direction === "east") carMesh.position.x += aiSpeed;
            else if (carData.direction === "west") carMesh.position.x -= aiSpeed;

            // Chunk transfer logic (remains the same)
            const boundary = CHUNK_SIZE / 2 + 5;
            let transferData = null;
            if (carMesh.position.z > boundary && carData.direction === "north") transferData = { nextI: 0, nextJ: 1, newPos: new THREE.Vector3(carMesh.position.x, 0, carMesh.position.z - CHUNK_SIZE) };
            else if (carMesh.position.z < -boundary && carData.direction === "south") transferData = { nextI: 0, nextJ: -1, newPos: new THREE.Vector3(carMesh.position.x, 0, carMesh.position.z + CHUNK_SIZE) };
            else if (carMesh.position.x > boundary && carData.direction === "east") transferData = { nextI: 1, nextJ: 0, newPos: new THREE.Vector3(carMesh.position.x - CHUNK_SIZE, 0, carMesh.position.z) };
            else if (carMesh.position.x < -boundary && carData.direction === "west") transferData = { nextI: -1, nextJ: 0, newPos: new THREE.Vector3(carMesh.position.x + CHUNK_SIZE, 0, carMesh.position.z) };

            if (transferData) {
              const currentChunkCoords = chunk.userData.chunkCoords;
              const nextChunkKey = getChunkKey(currentChunkCoords.i + transferData.nextI, currentChunkCoords.j + transferData.nextJ);
              const nextChunk = activeChunks[nextChunkKey];
              if (nextChunk) {
                chunk.remove(carMesh);
                aiCars.splice(i, 1);
                carMesh.position.copy(transferData.newPos);
                nextChunk.add(carMesh);
                if (!nextChunk.userData.aiCars) nextChunk.userData.aiCars = [];
                nextChunk.userData.aiCars.push(carData);
              } else {
                // Car drove out of loaded area, remove it
                chunk.remove(carMesh);
                aiCars.splice(i, 1);
                // Consider disposing geometry/material here if needed
              }
            }
          }

          // --- Turning Logic (Basic - happens near center) ---
          if (approachingIntersectionCenter && shouldMove) {
            const distToCenter = carPosLocal.length();
            if (distToCenter < HALF_ROAD_WIDTH) { // Turn only when very close to the center
              if (!carData.hasTurned && Math.random() < 0.15) {
                const turnDirection = Math.random() < 0.5 ? 'left' : 'right';
                // (Turning logic for direction and rotation remains the same)
                if (carData.direction === "north") {
                  carData.direction = turnDirection === 'left' ? 'west' : 'east';
                  carMesh.rotation.y = turnDirection === 'left' ? -Math.PI / 2 : Math.PI / 2;
                } else if (carData.direction === "south") {
                  carData.direction = turnDirection === 'left' ? 'east' : 'west';
                  carMesh.rotation.y = turnDirection === 'left' ? Math.PI / 2 : -Math.PI / 2;
                } else if (carData.direction === "east") {
                  carData.direction = turnDirection === 'left' ? 'north' : 'south';
                  carMesh.rotation.y = turnDirection === 'left' ? Math.PI : 0; // Corrected North (PI) vs South (0)
                } else if (carData.direction === "west") {
                  carData.direction = turnDirection === 'left' ? 'south' : 'north';
                  carMesh.rotation.y = turnDirection === 'left' ? 0 : Math.PI; // Corrected South (0) vs North (PI)
                }
                carData.hasTurned = true;
              }
            }
          } else if (carPosLocal.length() > HALF_ROAD_WIDTH * 2) { // Reset turn flag well after leaving intersection
            carData.hasTurned = false;
          }
        }
      }
    }


    // === Traffic Light Placement and Creation (Corrected Right-Side Logic) ===
    function placeTrafficLightsRightSide(chunkGroup) {
      const c = 0; // Center is 0
      const approachDist = HALF_ROAD_WIDTH + 2.5; // How far before intersection center
      const sideOffset = HALF_ROAD_WIDTH + 0.5;   // How far from road edge

      // Light for Northbound traffic (approaching from South, Z < 0). 
      // User reports this appears on left, so placing on West side (X < 0).
      const southFacingLight = createTrafficLight(c - sideOffset, c - approachDist, 0); // Faces North (Rotation 0)

      // Light for Southbound traffic (approaching from North, Z > 0). Place on East side (X > 0).
      const northFacingLight = createTrafficLight(c + sideOffset, c + approachDist, Math.PI); // Faces South (Rotation PI)

      // Light for Eastbound traffic (approaching from West, X < 0). Place on South side (Z > 0).
      const westFacingLight = createTrafficLight(c - approachDist, c + sideOffset, Math.PI / 2); // Faces East (Rotation PI/2)

      // Light for Westbound traffic (approaching from East, X > 0). Place on North side (Z < 0).
      const eastFacingLight = createTrafficLight(c + approachDist, c - sideOffset, -Math.PI / 2); // Faces West (Rotation -PI/2)

      chunkGroup.add(northFacingLight.group);
      chunkGroup.add(southFacingLight.group);
      chunkGroup.add(eastFacingLight.group);
      chunkGroup.add(westFacingLight.group);

      chunkGroup.userData.trafficLights = {
        northSouth: [northFacingLight, southFacingLight],
        eastWest: [eastFacingLight, westFacingLight],
        state: "NS_GREEN",
        timer: Math.random() * 20
      };
    }

    function createTrafficLight(posX, posZ, rotationY) {
      const group = new THREE.Group();
      const lightPoleGeom = new THREE.BoxGeometry(0.1, 3.8, 0.1);
      const lightPoleMat = new THREE.MeshPhongMaterial({ color: 0x555555 });
      const trafficLightPole = new THREE.Mesh(lightPoleGeom, lightPoleMat);
      trafficLightPole.position.y = 1.9;
      trafficLightPole.castShadow = true;
      group.add(trafficLightPole);
      const lightBoxGeom = new THREE.BoxGeometry(0.4, 1.2, 0.4);
      const lightBoxMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
      const trafficLightBox = new THREE.Mesh(lightBoxGeom, lightBoxMat);
      trafficLightBox.position.y = 3.2;
      group.add(trafficLightBox);
      const lightRadius = 0.12;
      const lightGeom = new THREE.CircleGeometry(lightRadius, 16);
      const lightOffsetZ = -0.21;
      const redMat = new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x000000 });
      const redLight = new THREE.Mesh(lightGeom, redMat);
      redLight.position.set(0, 3.6, lightOffsetZ);
      redLight.rotation.y = Math.PI;
      group.add(redLight);
      const yellowMat = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0x000000 });
      const yellowLight = new THREE.Mesh(lightGeom, yellowMat);
      yellowLight.position.set(0, 3.2, lightOffsetZ);
      yellowLight.rotation.y = Math.PI;
      group.add(yellowLight);
      const greenMat = new THREE.MeshPhongMaterial({ color: 0x00ff00, emissive: 0x000000 });
      const greenLight = new THREE.Mesh(lightGeom, greenMat);
      greenLight.position.set(0, 2.8, lightOffsetZ);
      greenLight.rotation.y = Math.PI;
      group.add(greenLight);
      group.position.set(posX, 0, posZ);
      group.rotation.y = rotationY;
      return { group, red: redLight, yellow: yellowLight, green: greenLight };
    }

    // === Traffic Light Logic Update (Unchanged) ===
    const T_GREEN = 12;
    const T_YELLOW = 3;
    const T_ALL_RED = 1;
    const T_CYCLE = T_GREEN + T_YELLOW + T_ALL_RED;

    function updateTrafficLights(delta) {
      for (const key in activeChunks) {
        const chunk = activeChunks[key];
        const tlData = chunk.userData.trafficLights;
        if (tlData) {
          tlData.timer += delta;
          const cycleTime = tlData.timer % (2 * T_CYCLE);
          let newState = tlData.state;
          if (cycleTime < T_GREEN) newState = "NS_GREEN";
          else if (cycleTime < T_GREEN + T_YELLOW) newState = "NS_YELLOW";
          else if (cycleTime < T_CYCLE) newState = "ALL_RED_1";
          else if (cycleTime < T_CYCLE + T_GREEN) newState = "EW_GREEN";
          else if (cycleTime < T_CYCLE + T_GREEN + T_YELLOW) newState = "EW_YELLOW";
          else newState = "ALL_RED_2";
          if (newState !== tlData.state) {
            tlData.state = newState;
            updateLightVisuals(tlData);
          }
        }
      }
    }
    function updateLightVisuals(tlData) {
      const isNSGreen = tlData.state === "NS_GREEN";
      const isNSYellow = tlData.state === "NS_YELLOW";
      const isEWGreen = tlData.state === "EW_GREEN";
      const isEWYellow = tlData.state === "EW_YELLOW";
      tlData.northSouth.forEach(light => {
        setLightEmissive(light.red, !isNSGreen && !isNSYellow, 0xff0000);
        setLightEmissive(light.yellow, isNSYellow, 0xffff00);
        setLightEmissive(light.green, isNSGreen, 0x00ff00);
      });
      tlData.eastWest.forEach(light => {
        setLightEmissive(light.red, !isEWGreen && !isEWYellow, 0xff0000);
        setLightEmissive(light.yellow, isEWYellow, 0xffff00);
        setLightEmissive(light.green, isEWGreen, 0x00ff00);
      });
    }
    function setLightEmissive(lightMesh, isOn, color) {
      lightMesh.material.emissive.setHex(isOn ? color : 0x000000);
    }


    // === Player Car Setup ===
    const playerCar = createCar(0x0077ff, true); // Brighter blue for player
    // *** FIX: Add player car to the main scene ***
    scene.add(playerCar);
    playerCar.position.set(CHUNK_SIZE / 2 + LANE_CENTER_OFFSET, 0, CHUNK_SIZE / 2 + 15); // Start in first chunk, south approach, right lane
    playerCar.rotation.y = 0; // Start facing North

    let carState = {
      position: new THREE.Vector2(playerCar.position.x, playerCar.position.z),
      heading: playerCar.rotation.y, // Match initial rotation
      velocity: 0,
      wheelAngle: 0
    };
    let carVelocityVec = new THREE.Vector3();

    const CAR_SPECS = {
      maxSteeringAngle: THREE.MathUtils.degToRad(35),
      wheelBase: 1.6,
      acceleration: 0.004,
      braking: 0.0015,
      maxSpeed: 0.25,
      maxReverseSpeed: 0.05,
      steeringSpeed: 0.055,
      steeringReturnSpeed: 0.08,
      friction: 0.0003,
      handlingFactor: 0.8
    };

    // === Player Car Update (Physics - Unchanged) ===
    function updatePlayerCar(delta) {
      const timeScale = delta * 60;
      let targetWheelAngle = 0;
      if (keys.ArrowLeft) targetWheelAngle = CAR_SPECS.maxSteeringAngle;
      else if (keys.ArrowRight) targetWheelAngle = -CAR_SPECS.maxSteeringAngle;

      if (targetWheelAngle !== 0) {
        carState.wheelAngle += Math.sign(targetWheelAngle - carState.wheelAngle) * CAR_SPECS.steeringSpeed * timeScale;
        if (targetWheelAngle > 0) carState.wheelAngle = Math.min(carState.wheelAngle, targetWheelAngle);
        else carState.wheelAngle = Math.max(carState.wheelAngle, targetWheelAngle);
      } else {
        carState.wheelAngle -= Math.sign(carState.wheelAngle) * CAR_SPECS.steeringReturnSpeed * timeScale;
        if (Math.abs(carState.wheelAngle) < 0.01) carState.wheelAngle = 0;
      }
      playerCar.frontLeftPivot.rotation.y = carState.wheelAngle;
      playerCar.frontRightPivot.rotation.y = carState.wheelAngle;

      let accelerationInput = 0;
      if (keys.ArrowUp) accelerationInput = 1;
      if (keys.ArrowDown) accelerationInput = -1;
      let currentAcceleration = 0;
      let currentBraking = 0;
      if (accelerationInput > 0) {
        if (carState.velocity < 0) { currentBraking = CAR_SPECS.braking; }
        else { currentAcceleration = CAR_SPECS.acceleration * (1 - (Math.abs(carState.velocity) / CAR_SPECS.maxSpeed)); }
      } else if (accelerationInput < 0) {
        if (carState.velocity > 0) { currentBraking = CAR_SPECS.braking; }
        else { currentAcceleration = -CAR_SPECS.acceleration * (1 - (Math.abs(carState.velocity) / CAR_SPECS.maxReverseSpeed)); }
      }
      carState.velocity += (currentAcceleration - currentBraking * Math.sign(carState.velocity)) * timeScale;
      carState.velocity -= Math.sign(carState.velocity) * CAR_SPECS.friction * timeScale;
      carState.velocity = Math.max(-CAR_SPECS.maxReverseSpeed, Math.min(CAR_SPECS.maxSpeed, carState.velocity));
      if (Math.abs(carState.velocity) < 0.001 && accelerationInput === 0) carState.velocity = 0;

      const moveDistance = carState.velocity * timeScale;
      if (Math.abs(moveDistance) > 0.0001) {
        const turnAngle = (moveDistance / CAR_SPECS.wheelBase) * Math.tan(carState.wheelAngle);
        carState.heading += turnAngle * CAR_SPECS.handlingFactor;
        carVelocityVec.set(Math.sin(carState.heading) * moveDistance, 0, Math.cos(carState.heading) * moveDistance);
        carState.position.x += carVelocityVec.x;
        carState.position.y += carVelocityVec.z;
      } else {
        carVelocityVec.set(0, 0, 0);
      }
      playerCar.position.x = carState.position.x;
      playerCar.position.z = carState.position.y;
      playerCar.rotation.y = carState.heading;

      if (Math.abs(carState.velocity) > CAR_SPECS.maxSpeed + 0.005) infractions.add("speeding");
      else infractions.delete("speeding");
    }

    // === Camera Update (Adjusted for Reverse) ===
    function updateCamera() {
      const distance = 8;
      const height = 4;
      const lookAheadFactor = 3;

      // Determine offsets based on car direction
      let sign = carState.velocity >= 0 ? 1 : -1;

      const camOffsetX = Math.sin(playerCar.rotation.y) * distance * sign;
      const camOffsetZ = Math.cos(playerCar.rotation.y) * distance * sign;
      // In reverse, we want the camera *in front* looking back
      const desiredCamPos = new THREE.Vector3(
        playerCar.position.x - camOffsetX,
        playerCar.position.y + height,
        playerCar.position.z - camOffsetZ
      );

      const lookAtOffsetX = Math.sin(playerCar.rotation.y) * lookAheadFactor * sign;
      const lookAtOffsetZ = Math.cos(playerCar.rotation.y) * lookAheadFactor * sign;
      // In reverse, we want to look *behind* the car's forward direction
      const desiredLookAt = new THREE.Vector3(
        playerCar.position.x + lookAtOffsetX,
        playerCar.position.y + 0.5,
        playerCar.position.z + lookAtOffsetZ
      );

      const lerpFactor = 0.08;
      camera.position.lerp(desiredCamPos, lerpFactor);
      const targetQuaternion = new THREE.Quaternion();
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.lookAt(camera.position, desiredLookAt, camera.up);
      targetQuaternion.setFromRotationMatrix(tempMatrix);
      camera.quaternion.slerp(targetQuaternion, lerpFactor * 2); // Slerp might need adjustment for reverse?
    }


    // === Infraction Checking (Adjusted for no stop lines) ===
    const infractions = new Set();
    let lastRedLightInfractionTime = 0;
    const redLightCooldown = 3.0; // Seconds before logging another red light run

    function checkInfractions() {
      const now = clock.getElapsedTime();
      const pX = playerCar.position.x;
      const pZ = playerCar.position.z;

      // Find current chunk
      const curI = Math.floor(pX / CHUNK_SIZE);
      const curJ = Math.floor(pZ / CHUNK_SIZE);
      const key = getChunkKey(curI, curJ);
      const chunk = activeChunks[key];

      if (!chunk || !chunk.userData.isIntersectionChunk || !chunk.userData.trafficLights) return;

      const tlData = chunk.userData.trafficLights;
      const chunkWorldPos = chunk.position;
      const localX = pX - chunkWorldPos.x;
      const localZ = pZ - chunkWorldPos.z;

      // --- Red Light Violation Check (Based on entering intersection center) ---
      const intersectionZoneRadius = HALF_ROAD_WIDTH; // Consider car entering the main square
      const distFromCenter = Math.sqrt(localX * localX + localZ * localZ);
      let carIsEnteringIntersection = false;

      // Check if car's center has entered the intersection square
      if (distFromCenter < intersectionZoneRadius) {
        // Check if moving significantly (not just stopped inside)
        if (carState.velocity > 0.01) {
          carIsEnteringIntersection = true;
        }
      }

      if (carIsEnteringIntersection && (now - lastRedLightInfractionTime > redLightCooldown)) {
        let heading = playerCar.rotation.y; // Radians
        let isRedOrYellow = false;
        let approachDirection = ''; // N, S, E, W - direction car is coming *from*

        // Determine approach based on heading (simplified)
        // Note: This assumes car is mostly aligned with axes when entering
        const angleDeg = THREE.MathUtils.radToDeg(heading);
        if (angleDeg > -45 && angleDeg <= 45) approachDirection = 'S'; // Heading North
        else if (angleDeg > 45 && angleDeg <= 135) approachDirection = 'W'; // Heading East
        else if (angleDeg > 135 || angleDeg <= -135) approachDirection = 'N'; // Heading South
        else if (angleDeg > -135 && angleDeg <= -45) approachDirection = 'E'; // Heading West


        if (approachDirection === 'N' || approachDirection === 'S') { // Approaching on N/S axis
          isRedOrYellow = tlData.state === "NS_YELLOW" || tlData.state === "EW_GREEN" || tlData.state === "EW_YELLOW" || tlData.state === "ALL_RED_1" || tlData.state === "ALL_RED_2";
        } else if (approachDirection === 'E' || approachDirection === 'W') { // Approaching on E/W axis
          isRedOrYellow = tlData.state === "EW_YELLOW" || tlData.state === "NS_GREEN" || tlData.state === "NS_YELLOW" || tlData.state === "ALL_RED_1" || tlData.state === "ALL_RED_2";
        }

        if (isRedOrYellow) {
          // console.log(`INFRACTION: Entered intersection from ${approachDirection} on Red/Yellow (State: ${tlData.state})`);
          infractions.add("ran_red_light");
          lastRedLightInfractionTime = now;
        } else {
          // Clear infraction if entered legally (might have been added previously)
          infractions.delete("ran_red_light");
        }
      }


      // --- Collision Check --- (moved to AI update for simplicity)
      // Basic check already happens in AI update loop. We just display it if needed.

      // --- Speeding Check --- (already in player update)

    }


    function updateInfractionDisplay() {
      const container = document.getElementById("infractions");
      let html = "";
      if (infractions.size > 0) {
        html = "<h3>Infractions:</h3>";
        infractions.forEach(inf => {
          let text = "";
          if (inf === "speeding") text = "⚠️ Speeding!";
          else if (inf === "ran_red_light") text = "🚦 Entered on Red/Yellow!";
          else if (inf === "collision") text = "💥 Collision!";
          else text = `❓ Unknown: ${inf}`;
          html += `<p>${text}</p>`;
        });
      }
      container.innerHTML = html;
      document.getElementById('speed-limit-info').innerText = `Speed Limit: ${Math.round(CAR_SPECS.maxSpeed * 385)} km/h (Sim: ${CAR_SPECS.maxSpeed.toFixed(2)} u/f)`;
    }


    // === Input Handling ===
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener("keydown", e => { if (keys.hasOwnProperty(e.code)) { e.preventDefault(); keys[e.code] = true; } });
    window.addEventListener("keyup", e => { if (keys.hasOwnProperty(e.code)) { e.preventDefault(); keys[e.code] = false; } });


    // === Game Loop ===
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1); // Clamp delta to prevent large jumps

      updateWorld();
      updateTrafficLights(delta);
      updatePlayerCar(delta);
      updateAICars(delta);
      updateCamera();
      checkInfractions(); // Check player actions
      updateInfractionDisplay(); // Update UI

      renderer.render(scene, camera);
    }
    animate();


    // === Asset Creation Functions === (Unchanged from previous working version)
    function createCar(color, isPlayer = false) {
      const carGroup = new THREE.Group();
      const bodyWidth = 1.2; const bodyHeight = 0.6; const bodyDepth = 2.2;
      const bodyGeometry = new THREE.BoxGeometry(bodyWidth, bodyHeight, bodyDepth);
      const bodyMaterial = new THREE.MeshPhongMaterial({ color: color, flatShading: false });
      const carBody = new THREE.Mesh(bodyGeometry, bodyMaterial);
      carBody.position.y = bodyHeight / 2 + 0.3;
      carBody.castShadow = true;
      carGroup.add(carBody);
      const roofWidth = bodyWidth * 0.85; const roofHeight = bodyHeight * 0.7; const roofDepth = bodyDepth * 0.5;
      const roofGeometry = new THREE.BoxGeometry(roofWidth, roofHeight, roofDepth);
      const roofMaterial = new THREE.MeshPhongMaterial({ color: color, flatShading: false });
      const carRoof = new THREE.Mesh(roofGeometry, roofMaterial);
      carRoof.position.y = carBody.position.y + bodyHeight / 2 + roofHeight / 2;
      carRoof.position.z = -bodyDepth * 0.1;
      carRoof.castShadow = true;
      carGroup.add(carRoof);
      const wheelRadius = 0.3; const wheelWidth = 0.2;
      const wheelGeometry = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 16);
      const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x111111 });
      const wheelY = wheelRadius; const wheelZOffset = bodyDepth * 0.35; const wheelXOffset = bodyWidth / 2;
      const frontLeftPivot = new THREE.Group(); frontLeftPivot.position.set(-wheelXOffset, wheelY, wheelZOffset); carGroup.add(frontLeftPivot);
      const frontRightPivot = new THREE.Group(); frontRightPivot.position.set(wheelXOffset, wheelY, wheelZOffset); carGroup.add(frontRightPivot);
      const frontLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial); frontLeftWheel.rotation.z = Math.PI / 2; frontLeftWheel.castShadow = true; frontLeftPivot.add(frontLeftWheel);
      const frontRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial); frontRightWheel.rotation.z = Math.PI / 2; frontRightWheel.castShadow = true; frontRightPivot.add(frontRightWheel);
      const rearLeftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial); rearLeftWheel.position.set(-wheelXOffset, wheelY, -wheelZOffset); rearLeftWheel.rotation.z = Math.PI / 2; rearLeftWheel.castShadow = true; carGroup.add(rearLeftWheel);
      const rearRightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial); rearRightWheel.position.set(wheelXOffset, wheelY, -wheelZOffset); rearRightWheel.rotation.z = Math.PI / 2; rearRightWheel.castShadow = true; carGroup.add(rearRightWheel);
      carGroup.frontLeftPivot = frontLeftPivot; carGroup.frontRightPivot = frontRightPivot;

      carGroup.collisionBox = new THREE.Box3();
      return carGroup;
    }
    function createTree(posX, posZ) {
      const tree = new THREE.Group();
      const height = 4 + Math.random() * 3; const radius = 0.3 + Math.random() * 0.3;
      const trunkGeometry = new THREE.CylinderGeometry(radius * 0.5, radius, height * 0.4, 8);
      const trunkMaterial = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
      const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
      trunk.position.y = height * 0.2; trunk.castShadow = true; tree.add(trunk);
      const leavesGeometry = new THREE.IcosahedronGeometry(height * 0.4, 0);
      const leavesMaterial = new THREE.MeshPhongMaterial({ color: 0x2E8B57, flatShading: true });
      const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
      leaves.position.y = height * 0.7; leaves.castShadow = true; tree.add(leaves);
      tree.position.set(posX, 0, posZ);
      return tree;
    }
    function createFence(posX, posZ, width, depth) {
      const fence = new THREE.Group(); const fenceMaterial = new THREE.MeshPhongMaterial({ color: 0xA0522D });
      const postSize = 0.1; const railHeight = 0.05; const postHeight = 1.2;
      const halfWidth = width / 2; const halfDepth = depth / 2;
      const cornerPositions = [{ x: -halfWidth, z: -halfDepth }, { x: halfWidth, z: -halfDepth }, { x: halfWidth, z: halfDepth }, { x: -halfWidth, z: halfDepth }];
      cornerPositions.forEach(pos => { const post = new THREE.Mesh(new THREE.BoxGeometry(postSize, postHeight, postSize), fenceMaterial); post.position.set(pos.x, postHeight / 2, pos.z); post.castShadow = true; fence.add(post); });
      const createRails = (w, h, x, z, isHorizontal) => {
        const topRail = new THREE.Mesh(new THREE.BoxGeometry(w, railHeight, h), fenceMaterial); topRail.position.set(x, postHeight * 0.75, z); topRail.castShadow = true; fence.add(topRail);
        const bottomRail = new THREE.Mesh(new THREE.BoxGeometry(w, railHeight, h), fenceMaterial); bottomRail.position.set(x, postHeight * 0.25, z); bottomRail.castShadow = true; fence.add(bottomRail);
      };
      createRails(width, postSize, 0, -halfDepth, true); // North
      createRails(width, postSize, 0, halfDepth, true);  // South
      createRails(postSize, depth, halfWidth, 0, false); // East
      createRails(postSize, depth, -halfWidth, 0, false);// West
      fence.position.set(posX, 0, posZ);
      return fence;
    }
    function createBuilding(posX, posZ, width, depth, height) {
      const buildingMaterial = new THREE.MeshPhongMaterial({ color: new THREE.Color(0xcccccc).lerp(new THREE.Color(0xffffff), Math.random() * 0.3), flatShading: true });
      const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
      const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
      building.position.set(posX, height / 2, posZ);
      building.castShadow = true; building.receiveShadow = true;
      return building;
    }
  </script>
